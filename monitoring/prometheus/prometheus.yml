global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ingestion-api"
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["ingestion-api:8000"]

  - job_name: "analytics-service"
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["analytics-service:8002"]
