version: 2

models:
  - name: fct_replenishment_signals
    description: "Executive replenishment mart — backs Grafana BI dashboard"
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: urgency_score
        tests: [not_null]
  - name: fct_daily_revenue
    columns:
      - name: sale_date
        tests: [not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_warehouse_master')
              field: product_id

  - name: dim_warehouse
    columns:
      - name: warehouse_location
        tests: [unique, not_null]

  - name: fct_inventory_movements
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: shipment_status
        tests:
          - not_null
          - accepted_values:
              values: ['Pending', 'InTransit', 'Delivered']
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_warehouse_master')
              field: product_id
              config:
                severity: warn

  - name: metric_daily_order_growth
    description: "Semantic metric daily_order_growth"
    columns:
      - name: sale_date
        tests: [unique, not_null]
