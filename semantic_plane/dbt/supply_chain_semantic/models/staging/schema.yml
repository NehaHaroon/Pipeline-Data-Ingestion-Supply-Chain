version: 2

models:
  - name: stg_sales_history
    description: "Cleaned sales events from Silver Iceberg"
    columns:
      - name: receipt_id
        tests: [unique, not_null]
      - name: product_id
        tests: [not_null]
      - name: units_sold
        tests: [not_null]

  - name: stg_warehouse_master
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: unit_cost
        tests: [not_null]

  - name: stg_inventory_transactions
    columns:
      - name: transaction_id
        tests: [unique, not_null]
      - name: transaction_type
        tests:
          - not_null
          - accepted_values:
              values: ['IN', 'OUT', 'ADJUSTMENT', 'RETURN', 'CORRECTION']

  - name: stg_iot_rfid_stream
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: current_stock_on_shelf
        tests: [not_null]
